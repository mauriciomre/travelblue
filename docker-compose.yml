services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      # Volumen aislado para imgs/ — NUNCA la carpeta real, para que subir/borrar
      # fotos de prueba no toque las imágenes reales de productos en disco.
      - travelblue_imgs_data:/var/www/html/imgs
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS: root
      DB_NAME: travelblue
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: travelblue
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - travelblue_db_data:/var/lib/mysql

volumes:
  travelblue_db_data:
  travelblue_imgs_data:
