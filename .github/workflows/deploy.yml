name: Deploy a Ferozo (producción)

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy vía FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          # Nunca tocar credenciales de producción, imágenes subidas por el admin,
          # ni archivos de infraestructura local — solo el código de la app.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/db.php
            **/imgs/**
            **/docker/**
            **/docker-compose.yml
            **/README.md
